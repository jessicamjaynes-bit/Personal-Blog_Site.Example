<!-- Replace YOUR_FORM_ENDPOINT with your Formspree or Web3Forms link -->
<form action="https://formspree.io/f/YOUR_FORM_ENDPOINT" method="POST">
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="John Smith" required>
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
        <label>Inquiry Type / Plan</label>
        <select name="inquiry_type">
            <option>Free Sunday Newsletter Reader</option>
            <option>Supporter Subscription ($5/mo)</option>
            <option>Sponsorship / Media Kit Inquiry</option>
            <option>Web Design Service Consultation</option>
        </select>
    </div>

    <div class="form-group">
        <label>Message or Notes (Optional)</label>
        <textarea name="message" rows="3" placeholder="Tell us about your project or sponsorship proposal..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Submit Registration / Request →</button>
</form>
