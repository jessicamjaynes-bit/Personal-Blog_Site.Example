<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - The Chronicle Journal</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #1c1917; background-color: #fafaf9; line-height: 1.6; }
        header { background: #ffffff; border-bottom: 1px solid #e7e5e4; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .journal-title { font-size: 24px; font-weight: bold; color: #0c0a09; text-decoration: none; }
        .nav-links a { text-decoration: none; color: #57534e; font-size: 14px; font-weight: 600; margin-left: 15px; }

        .container { max-width: 600px; margin: 50px auto; padding: 0 20px; }
        .card { background: #ffffff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .card h1 { font-size: 28px; color: #0c0a09; margin-top: 0; margin-bottom: 10px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #44403c; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #d6d3d1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }

        .btn-submit { width: 100%; background: #0c0a09; color: #ffffff; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #292524; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="journal-title">✒️ The Chronicle Journal</a>
        <div class="nav-links">
            <a href="index.html">← Return to Articles</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h1>Join The Chronicle Journal</h1>
            <p style="color: #78716c; margin-bottom: 25px;">Select your subscription preference to receive essays, updates, and resources.</p>

            <form onsubmit="event.preventDefault(); alert('Registration successful! Welcome to the journal.');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Sarah Johnson" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="sarah@example.com" required>
                </div>

                <div class="form-group">
                    <label>Subscription Tier</label>
                    <select>
                        <option>Free Reader (Weekly Sunday Newsletter)</option>
                        <option>Daily Digest (All Articles Direct to Email)</option>
                        <option>VIP Supporter (Articles + Downloads & Assets)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Complete Free Sign Up →</button>
            </form>
        </div>
    </div>

</body>
</html>
